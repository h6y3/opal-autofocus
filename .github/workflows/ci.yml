name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: scripts/swift-test
      - run: swift build -c release
      - run: ruby -c packaging/Formula/opal-autofocus.rb
      - run: plutil -lint packaging/com.opal-autofocus.agent.plist
